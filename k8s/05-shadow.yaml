apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow-primary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-shadow
      role: primary
  template:
    metadata:
      labels:
        app: aceest-shadow
        role: primary
    spec:
      containers:
      - name: aceest-api
        image: 2025tm93177rashi/aceest-fitness:v3.2.4-7
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-primary-svc
spec:
  selector:
    app: aceest-shadow
    role: primary
  ports:
  - port: 80
    targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow-mirror
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-shadow
      role: mirror
  template:
    metadata:
      labels:
        app: aceest-shadow
        role: mirror
    spec:
      containers:
      - name: aceest-api
        image: 2025tm93177rashi/aceest-fitness:latest
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-mirror-svc
spec:
  selector:
    app: aceest-shadow
    role: mirror
  ports:
  - port: 80
    targetPort: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-shadow-ingress
  annotations:
    nginx.ingress.kubernetes.io/mirror-target: "http://aceest-shadow-mirror-svc.default.svc.cluster.local$request_uri"
spec:
  ingressClassName: nginx
  rules:
  - host: aceest-shadow.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aceest-shadow-primary-svc
            port:
              number: 80
