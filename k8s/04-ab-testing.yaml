apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-ab-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-ab
      variant: a
  template:
    metadata:
      labels:
        app: aceest-ab
        variant: a
    spec:
      containers:
      - name: aceest-api
        image: 2025tm93177rashi/aceest-fitness:v3.2.4-7
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-ab-v1-svc
spec:
  selector:
    app: aceest-ab
    variant: a
  ports:
  - port: 80
    targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-ab-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-ab
      variant: b
  template:
    metadata:
      labels:
        app: aceest-ab
        variant: b
    spec:
      containers:
      - name: aceest-api
        image: 2025tm93177rashi/aceest-fitness:latest
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-ab-v2-svc
spec:
  selector:
    app: aceest-ab
    variant: b
  ports:
  - port: 80
    targetPort: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-ab-main
spec:
  ingressClassName: nginx
  rules:
  - host: aceest-ab.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aceest-ab-v1-svc
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-ab-beta
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-by-header: "X-Version"
    nginx.ingress.kubernetes.io/canary-by-header-value: "beta"
spec:
  ingressClassName: nginx
  rules:
  - host: aceest-ab.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aceest-ab-v2-svc
            port:
              number: 80
