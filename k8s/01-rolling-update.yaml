apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-rolling
  labels:
    app: aceest-rolling
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aceest-rolling
  template:
    metadata:
      labels:
        app: aceest-rolling
        version: v1
    spec:
      containers:
      - name: aceest-api
        image: 2025tm93177rashi/aceest-fitness:v3.2.4-7
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-rolling-svc
spec:
  type: NodePort
  selector:
    app: aceest-rolling
  ports:
  - port: 80
    targetPort: 5000
